spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rpl_auction?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      # Logs a stack trace if a connection is held longer than this (ms) — surfaces leaks.
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: RPL_AUCTION_JWT_SECRET_KEY_MUST_BE_AT_LEAST_256_BITS_LONG_FOR_HS256
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
